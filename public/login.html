<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — جدول الجيم</title>
<link rel="stylesheet" href="auth-style.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">جدول <span>الجيم</span></div>
    <div class="subtitle">سجل دخولك عشان تتابع جدولك</div>
    <div class="error-box" id="errorBox"></div>
    <form id="loginForm">
      <label>الإيميل</label>
      <input type="email" id="email" required autocomplete="email">
      <label>الباسورد</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit">دخول</button>
    </form>
    <div class="switch-link">لسه معملتش حساب؟ <a href="/signup.html">اعمل حساب جديد</a></div>
  </div>

<script>
const form = document.getElementById("loginForm");
const errorBox = document.getElementById("errorBox");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("show");
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = form.querySelector("button");
  btn.disabled = true; btn.textContent = "بيدخل...";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "حصل خطأ");
    window.location.href = "/app.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("show");
    btn.disabled = false; btn.textContent = "دخول";
  }
});
</script>
</body>
</html>
